<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>2024-2030 年週數對照表</title>
<style>
  :root{
    --paper:#f6f3ec;
    --ink:#2b2926;
    --rule:#d8d2c4;
    --tab:#5c6b57;
    --tab-soft:#e4e9df;
    --muted:#b4ada0;
    --accent:#9c5a3c;
    --today:#f0e4d4;
    --red:#c0392b;
    --gold:#e8b923;
    --gold-soft:#fbe9b0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Iowan Old Style","Noto Serif TC","PingFang TC",serif;
    padding:20px 24px 30px;
  }
  h1{
    font-size:calc(1.4rem + 2px);
    font-weight:600;
    letter-spacing:.04em;
    margin:0 0 4px;
  }
  .sub{
    color:var(--tab);
    font-size:.8rem;
    margin-bottom:14px;
    letter-spacing:.05em;
  }
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
    flex-wrap:wrap;
    margin-bottom:10px;
  }
  .title-block{min-width:0;}
  .top-right{
    display:flex;
    align-items:flex-start;
    gap:12px;
    flex-wrap:wrap;
  }
  .search-wrap{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:4px;
  }
  .search-box{
    display:flex;
    gap:6px;
  }
  .search-box input{
    font-family:"SF Mono","Courier New",monospace;
    font-size:.85rem;
    border:1px solid var(--rule);
    background:#fffdf9;
    color:var(--ink);
    padding:6px 10px;
    width:120px;
    border-radius:2px;
  }
  .search-box input:focus{
    outline:none;
    border-color:var(--tab);
  }
  .search-box button{
    font-family:inherit;
    font-size:.85rem;
    font-weight:700;
    background:var(--ink);
    color:var(--paper);
    border:1px solid var(--ink);
    padding:6px 16px;
    border-radius:2px;
    cursor:pointer;
    letter-spacing:.03em;
  }
  .search-msg{
    font-size:.72rem;
    color:var(--red);
    min-height:1em;
    text-align:right;
  }
  tr.goldweek td{background:var(--gold-soft) !important;}
  .wknum.goldweek{background:var(--gold) !important;color:var(--ink);}
  .day.goldweek{background:var(--gold-soft) !important;}

  .bar{
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    gap:20px;
    align-items:center;
    margin-bottom:16px;
  }
  .clock{
    font-family:"SF Mono","Courier New",monospace;
    font-size:.78rem;
    font-weight:700;
    color:var(--tab);
    letter-spacing:.03em;
    white-space:nowrap;
  }
  .toggle{
    display:flex;
    gap:8px;
  }
  .toggle button, .years button{
    font-family:inherit;
    font-size:.85rem;
    font-weight:700;
    background:none;
    border:1px solid var(--rule);
    color:var(--ink);
    padding:6px 16px;
    border-radius:2px;
    cursor:pointer;
    letter-spacing:.03em;
  }
  .toggle button.active{
    background:var(--tab);
    color:var(--paper);
    border-color:var(--tab);
  }
  .years{display:flex;gap:8px;}
  .years button.active{
    background:var(--red);
    color:var(--paper);
    border-color:var(--red);
  }
  section{display:none;}
  section.active{display:block;}

  /* ---- table view ---- */
  table{
    border-collapse:collapse;
    width:100%;
    max-width:620px;
    font-family:"SF Mono","Courier New",monospace;
    font-size:.88rem;
  }
  th{
    text-align:left;
    font-family:"Iowan Old Style","Noto Serif TC",serif;
    font-size:.78rem;
    letter-spacing:.08em;
    color:var(--tab);
    border-bottom:1px solid var(--ink);
    padding:6px 10px;
    font-weight:600;
  }
  td{
    padding:5px 10px;
    border-bottom:1px solid var(--rule);
  }
  td.wk{
    color:var(--red);
    font-weight:700;
    width:60px;
  }
  td:not(.wk){font-weight:700;}
  .out{color:var(--muted);font-weight:400;}
  tr.today td{background:var(--today);}

  /* ---- calendar view ---- */
  .months{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px 20px;
    max-width:1760px;
  }
  .month{
    border:1px solid var(--rule);
    background:#fffdf9;
    padding:14px 16px 16px;
  }
  .month h2{
    font-size:calc(1.15rem + 2px);
    margin:0 0 10px;
    letter-spacing:.05em;
    border-bottom:1px solid var(--rule);
    padding-bottom:8px;
  }
  .mgrid{
    display:grid;
    grid-template-columns:34px repeat(7,1fr);
    font-family:"SF Mono","Courier New",monospace;
    font-size:.92rem;
    row-gap:6px;
  }
  .mgrid .dow{
    color:var(--tab);
    text-align:center;
    font-family:"Iowan Old Style","Noto Serif TC",serif;
    font-size:.8rem;
    font-weight:700;
    padding-bottom:4px;
  }
  .wknum{
    color:var(--red);
    font-weight:700;
    font-size:.78rem;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--tab-soft);
  }
  .day{
    text-align:center;
    padding:3px 0 5px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    gap:1px;
    min-height:2.6em;
  }
  .day .solar{font-weight:700;}
  .day .lunar{
    font-size:.6rem;
    font-weight:400;
    color:var(--tab);
    font-family:"Iowan Old Style","Noto Serif TC",serif;
    white-space:nowrap;
    letter-spacing:-0.02em;
    line-height:1.2;
  }
  .day .lunar.holiday{
    color:#b3261e;
    font-weight:700;
  }
  .day.out .lunar.holiday{color:#c0716c;}
  .day.out .lunar{color:var(--muted);}
  .day.out{color:var(--muted);}
  .day.out .solar{font-weight:400;}
  .day.today{background:var(--today);border-radius:2px;}

  footer{
    margin-top:16px;
    font-size:.72rem;
    color:var(--tab);
    letter-spacing:.03em;
  }

  @media (max-width:820px){
    .months{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:560px){
    .months{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="title-block">
    <h1 id="title">2024-2030 年週數對照表</h1>
    <div class="sub">週日為每週起始日・週六為結束日・淺灰字為跨年份日期・製作人：葉子銘（小葉）</div>
  </div>
  <div class="top-right">
    <div class="search-wrap">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="例如 2650" maxlength="4" inputmode="numeric">
        <button id="search-btn">搜尋</button>
      </div>
      <div id="search-msg" class="search-msg"></div>
    </div>
    <div class="toggle">
      <button id="btn-table">清單檢視</button>
      <button id="btn-cal" class="active">月曆檢視</button>
    </div>
  </div>
</div>

<div class="bar">
  <div class="years" id="years"></div>
  <div class="clock" id="live-clock"></div>
</div>

<section id="table-view">
  <table>
    <thead><tr><th>週數</th><th>起始日（日）</th><th>中間日（三）</th><th>結束日（六）</th></tr></thead>
    <tbody id="table-body"></tbody>
  </table>
</section>

<section id="cal-view" class="active">
  <div class="months" id="months"></div>
</section>

;
const YEARS = [2024,2025,2026,2027,2028,2029,2030];
const monthNames = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
const dows = ["日","一","二","三","四","五","六"];

function weekInfoForDate(date){
  const y = date.getFullYear();
  const jan1 = new Date(y,0,1);
  const offset = jan1.getDay(); // Sunday=0, matches days since Sunday
  const week1Start = new Date(y,0,1-offset);
  const diffDays = Math.round((date - week1Start) / 86400000);
  const weekNum = Math.floor(diffDays/7) + 1;
  return {year:y, month:date.getMonth()+1, day:date.getDate(), week:`W${String(weekNum).padStart(2,'0')}`};
}

function getNow(){
  return weekInfoForDate(new Date());
}

let currentYear = (()=>{
  const y = new Date().getFullYear();
  return YEARS.includes(y) ? y : 2026;
})();
let highlightWeek = null;
let highlightYear = null;

function renderYearButtons(){
  const el = document.getElementById('years');
  el.innerHTML = '';
  YEARS.forEach(y=>{
    const btn = document.createElement('button');
    btn.textContent = y;
    if(y===currentYear) btn.classList.add('active');
    btn.onclick = ()=>{ currentYear = y; renderAll(); };
    el.appendChild(btn);
  });
}

function renderTable(){
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = '';
  const rows = ALL_DATA[currentYear].rows;
  const now = getNow();
  rows.forEach(([wk,start,mid,end,startOut,midOut,endOut])=>{
    const tr = document.createElement('tr');
    if(currentYear===now.year && wk===now.week) tr.className='today';
    if(wk===highlightWeek && currentYear===highlightYear) tr.className='goldweek';
    tr.dataset.wk = wk;
    tr.innerHTML = `<td class="wk">${wk}</td><td class="${startOut?'out':''}">${start}</td><td class="${midOut?'out':''}">${mid}</td><td class="${endOut?'out':''}">${end}</td>`;
    tbody.appendChild(tr);
  });
}

function renderCalendar(){
  const monthsEl = document.getElementById('months');
  monthsEl.innerHTML = '';
  const monthsData = ALL_DATA[currentYear].months;
  const now = getNow();
  monthsData.forEach((weeks, mi)=>{
    const div = document.createElement('div');
    div.className='month';
    let html = `<h2>${monthNames[mi]}</h2><div class="mgrid">`;
    html += `<div></div>` + dows.map(d=>`<div class="dow">${d}</div>`).join('');
    weeks.forEach(([wk, days])=>{
      const wkStr = `W${String(wk).padStart(2,'0')}`;
      const isGold = wkStr===highlightWeek && currentYear===highlightYear;
      html += `<div class="wknum ${isGold?'goldweek':''}" data-wk="${wkStr}">W${String(wk).padStart(2,'0')}</div>`;
      days.forEach(d=>{
        const [datePart, lunar, isHol] = d.split('|');
        const isYearOut = datePart.startsWith('(');
        const clean = isYearOut ? datePart.slice(1,-1) : datePart;
        const [mm, dd] = clean.split('/');
        const sameMonth = parseInt(mm,10) === (mi+1);
        let label;
        if(isYearOut){
          label = dd;
        } else if(sameMonth){
          label = dd;
        } else {
          label = '';
        }
        const isToday = !isYearOut && currentYear===now.year && (mi+1)===now.month && parseInt(dd,10)===now.day;
        const lunarClass = 'lunar' + (isHol==='1' ? ' holiday' : '');
        const inner = label ? `<div class="solar">${label}</div><div class="${lunarClass}">${lunar}</div>` : '';
        html += `<div class="day ${isYearOut?'out':''} ${isToday?'today':''} ${isGold?'goldweek':''}">${inner}</div>`;
      });
    });
    html += `</div>`;
    div.innerHTML = html;
    monthsEl.appendChild(div);
  });
}

function updateClock(){
  const el = document.getElementById('live-clock');
  const now = new Date();
  const info = weekInfoForDate(now);
  const pad = n => String(n).padStart(2,'0');
  el.textContent = `今天：${info.year}/${pad(info.month)}/${pad(info.day)}（${info.week}）${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
}

function renderAll(){
  renderYearButtons();
  renderTable();
  renderCalendar();
  updateClock();
}

document.getElementById('btn-table').onclick = ()=>{
  document.getElementById('table-view').classList.add('active');
  document.getElementById('cal-view').classList.remove('active');
  document.getElementById('btn-table').classList.add('active');
  document.getElementById('btn-cal').classList.remove('active');
};
document.getElementById('btn-cal').onclick = ()=>{
  document.getElementById('cal-view').classList.add('active');
  document.getElementById('table-view').classList.remove('active');
  document.getElementById('btn-cal').classList.add('active');
  document.getElementById('btn-table').classList.remove('active');
};

function scrollToHighlight(){
  requestAnimationFrame(()=>{
    const activeSection = document.querySelector('section.active');
    const target = activeSection ? activeSection.querySelector('.goldweek') : null;
    if(target){
      target.scrollIntoView({behavior:'smooth', block:'center'});
    }
  });
}

function doSearch(){
  const msg = document.getElementById('search-msg');
  const raw = document.getElementById('search-input').value.trim();
  if(!/^\d{4}$/.test(raw)){
    msg.textContent = '請輸入4碼，例如 2650（2026年第50週）';
    return;
  }
  const yy = parseInt(raw.slice(0,2),10);
  const ww = parseInt(raw.slice(2,4),10);
  const year = 2000 + yy;
  const wkStr = `W${String(ww).padStart(2,'0')}`;
  if(!ALL_DATA[year]){
    msg.textContent = `找不到 ${year} 年的資料`;
    return;
  }
  const found = ALL_DATA[year].rows.some(r=>r[0]===wkStr);
  if(!found){
    msg.textContent = `找不到 ${year} 年 ${wkStr}`;
    return;
  }
  msg.textContent = '';
  currentYear = year;
  highlightWeek = wkStr;
  highlightYear = year;
  renderAll();
  scrollToHighlight();
}

document.getElementById('search-btn').onclick = doSearch;
document.getElementById('search-input').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') doSearch();
});
document.getElementById('search-input').addEventListener('input', (e)=>{
  const raw = e.target.value.trim();
  document.getElementById('search-msg').textContent = '';
  if(!/^\d{4}$/.test(raw)){
    if(highlightWeek !== null){
      highlightWeek = null;
      highlightYear = null;
      renderAll();
    }
  }
});

renderAll();
setInterval(updateClock, 1000);
</script>
